name: Fetch Android WebView 106

on:
  push:
    branches:
      - tmp-fetch-webview-106
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout helper
        uses: actions/checkout@v4

      - name: Install parser
        run: python3 -m pip install --quiet requests beautifulsoup4

      - name: Fetch exact WebView APK
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import sys
          from pathlib import Path
          from urllib.parse import urljoin

          import requests
          from bs4 import BeautifulSoup

          START = 'https://www.apkmirror.com/apk/google-inc/android-system-webview/android-system-webview-106-0-5249-126-release/android-system-webview-106-0-5249-126-2-android-apk-download/'
          EXPECTED = '13182d1a09508114d175c9db2bf0be2719da7a204be28140e7f8bd837d6eb788'
          OUT = Path('Android-System-WebView-106.0.5249.126-Android6-ARM.apk')

          session = requests.Session()
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36',
              'Accept-Language': 'en-US,en;q=0.9',
              'Accept-Encoding': 'gzip, deflate, br',
              'DNT': '1',
              'Upgrade-Insecure-Requests': '1',
          })

          def is_apk(response, data):
              ctype = response.headers.get('content-type', '').lower()
              return data.startswith(b'PK\x03\x04') or 'android.package-archive' in ctype

          def accept_apk(response, data):
              digest = hashlib.sha256(data).hexdigest()
              print('APK candidate:', response.url, len(data), digest, flush=True)
              if digest != EXPECTED:
                  raise RuntimeError(f'APK SHA-256 mismatch: expected {EXPECTED}, got {digest}')
              OUT.write_bytes(data)
              print('Verified exact APK:', OUT, flush=True)

          current = START
          referer = 'https://www.apkmirror.com/'
          for step in range(1, 9):
              print(f'GET step {step}: {current}', flush=True)
              response = session.get(
                  current,
                  headers={'Referer': referer},
                  timeout=120,
                  allow_redirects=True,
              )
              print(' ->', response.status_code, response.url, response.headers.get('content-type'), len(response.content), flush=True)
              response.raise_for_status()
              data = response.content
              if is_apk(response, data):
                  accept_apk(response, data)
                  break

              Path(f'debug-step-{step}.html').write_bytes(data)
              soup = BeautifulSoup(data, 'html.parser')
              candidates = []

              # APKMirror's normal two-page flow uses downloadButton on both pages.
              for selector in (
                  'a.downloadButton[href]',
                  'a[href*="/download/"]',
                  'a[href*="download.php"]',
                  'a[rel="nofollow"][href]',
              ):
                  for anchor in soup.select(selector):
                      href = anchor.get('href')
                      if not href:
                          continue
                      absolute = urljoin(response.url, href)
                      text = anchor.get_text(' ', strip=True).lower()
                      low = absolute.lower()
                      score = 0
                      if 'downloadbutton' in (anchor.get('class') or []): score += 100
                      if 'download.php' in low: score += 100
                      if '/download/' in low: score += 60
                      if 'download apk' in text: score += 80
                      if 'forcebaseapk=true' in low: score += 40
                      if 'apkmirror.com' in low or 'apkmirror-download.com' in low: score += 20
                      if score:
                          candidates.append((score, absolute))

              # Also inspect meta refresh and canonical download URLs.
              for meta in soup.select('meta[http-equiv]'):
                  if meta.get('http-equiv', '').lower() != 'refresh':
                      continue
                  content = meta.get('content', '')
                  if 'url=' in content.lower():
                      candidates.append((90, urljoin(response.url, content.split('=', 1)[1].strip())))

              unique = []
              seen = set()
              for score, url in sorted(candidates, reverse=True):
                  if url in seen or url == response.url:
                      continue
                  seen.add(url)
                  unique.append((score, url))
              print('Candidates:', unique[:10], flush=True)
              if not unique:
                  raise RuntimeError(f'No download link found at step {step}')

              referer = response.url
              current = unique[0][1]
          else:
              raise RuntimeError('Download flow exceeded maximum steps')

          if not OUT.exists():
              raise RuntimeError('Exact APK was not downloaded')
          PY

      - name: Verify archive and signature
        shell: bash
        run: |
          set -euxo pipefail
          FILE='Android-System-WebView-106.0.5249.126-Android6-ARM.apk'
          echo '13182d1a09508114d175c9db2bf0be2719da7a204be28140e7f8bd837d6eb788  '"$FILE" | sha256sum -c -
          unzip -t "$FILE" > zip-test.txt
          jarsigner -verify -certs -verbose "$FILE" > jarsigner.txt
          sha256sum "$FILE" > SHA256.txt
          ls -lh "$FILE"

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-System-WebView-106-verified
          path: |
            Android-System-WebView-106.0.5249.126-Android6-ARM.apk
            SHA256.txt
            jarsigner.txt
            zip-test.txt
          if-no-files-found: error
          retention-days: 2

      - name: Upload debug pages on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: webview-fetch-debug-session
          path: debug-step-*.html
          if-no-files-found: ignore
          retention-days: 1
