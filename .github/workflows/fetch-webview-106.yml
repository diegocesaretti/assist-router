name: Fetch Android WebView 106

on:
  push:
    branches:
      - tmp-fetch-webview-106
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout helper
        uses: actions/checkout@v4

      - name: Fetch exact WebView APK
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import html
          import http.cookiejar
          import re
          from pathlib import Path
          from urllib.parse import urljoin
          from urllib.request import (
              Request,
              build_opener,
              HTTPCookieProcessor,
              HTTPRedirectHandler,
          )

          START = 'https://www.apkmirror.com/apk/google-inc/android-system-webview/android-system-webview-106-0-5249-126-release/android-system-webview-106-0-5249-126-2-android-apk-download/'
          EXPECTED = '13182d1a09508114d175c9db2bf0be2719da7a204be28140e7f8bd837d6eb788'
          OUT = Path('Android-System-WebView-106.0.5249.126-Android6-ARM.apk')
          UA = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36'

          jar = http.cookiejar.CookieJar()
          opener = build_opener(HTTPCookieProcessor(jar), HTTPRedirectHandler())

          def fetch(url, referer):
              print('GET', url, flush=True)
              request = Request(url, headers={
                  'User-Agent': UA,
                  'Accept': '*/*',
                  # The first successful probe used a same-page referrer.
                  'Referer': referer,
              })
              with opener.open(request, timeout=180) as response:
                  data = response.read()
                  headers = dict(response.headers)
                  final = response.geturl()
              print(' ->', final, headers.get('Content-Type'), len(data), 'cookies', len(jar), flush=True)
              return final, headers, data

          def is_apk(headers, data):
              return data.startswith(b'PK\x03\x04') or 'android.package-archive' in headers.get('Content-Type', '').lower()

          def extract_links(base, data):
              text = data.decode('utf-8', 'ignore')
              links = []
              # Prefer anchors explicitly marked as APKMirror download buttons.
              for tag in re.findall(r'<a\b[^>]*>.*?</a>', text, flags=re.I | re.S):
                  href_match = re.search(r'href=["\']([^"\']+)["\']', tag, flags=re.I)
                  if not href_match:
                      continue
                  href = html.unescape(href_match.group(1))
                  plain = re.sub(r'<[^>]+>', ' ', tag)
                  plain = html.unescape(re.sub(r'\s+', ' ', plain)).strip().lower()
                  low_tag = tag.lower()
                  low_href = href.lower()
                  score = 0
                  if 'downloadbutton' in low_tag: score += 150
                  if 'download apk' in plain: score += 120
                  if 'download.php' in low_href: score += 120
                  if '/download/' in low_href: score += 80
                  if 'forcebaseapk=true' in low_href: score += 40
                  if score:
                      links.append((score, urljoin(base, href), plain[:120]))
              # Some final pages expose the file URL in JavaScript rather than an anchor.
              for raw in re.findall(r'https?://[^\s"\'<>]+', text):
                  url = html.unescape(raw)
                  low = url.lower()
                  score = 0
                  if '.apk' in low: score += 200
                  if 'download' in low: score += 30
                  if 'apkmirror' in low: score += 20
                  if score:
                      links.append((score, url, 'raw-url'))
              unique = []
              seen = set()
              for item in sorted(links, reverse=True):
                  if item[1] in seen:
                      continue
                  seen.add(item[1])
                  unique.append(item)
              return unique

          current = START
          referer = START
          for step in range(1, 9):
              final, headers, data = fetch(current, referer)
              if is_apk(headers, data):
                  digest = hashlib.sha256(data).hexdigest()
                  print('APK SHA256', digest, flush=True)
                  if digest != EXPECTED:
                      raise RuntimeError(f'hash mismatch: {digest}')
                  OUT.write_bytes(data)
                  break

              Path(f'debug-step-{step}.html').write_bytes(data)
              candidates = extract_links(final, data)
              print('candidates', candidates[:8], flush=True)
              if not candidates:
                  raise RuntimeError(f'no APK download link found at step {step}')
              referer = final
              current = candidates[0][1]
          else:
              raise RuntimeError('download flow exceeded maximum steps')

          if not OUT.exists():
              raise RuntimeError('exact APK not downloaded')
          PY

      - name: Verify archive and signature
        shell: bash
        run: |
          set -euxo pipefail
          FILE='Android-System-WebView-106.0.5249.126-Android6-ARM.apk'
          echo '13182d1a09508114d175c9db2bf0be2719da7a204be28140e7f8bd837d6eb788  '"$FILE" | sha256sum -c -
          unzip -t "$FILE" > zip-test.txt
          jarsigner -verify -certs -verbose "$FILE" > jarsigner.txt
          sha256sum "$FILE" > SHA256.txt
          ls -lh "$FILE"

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-System-WebView-106-verified
          path: |
            Android-System-WebView-106.0.5249.126-Android6-ARM.apk
            SHA256.txt
            jarsigner.txt
            zip-test.txt
          if-no-files-found: error
          retention-days: 2

      - name: Upload debug pages on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: webview-fetch-debug-urllib-session
          path: debug-step-*.html
          if-no-files-found: ignore
          retention-days: 1
