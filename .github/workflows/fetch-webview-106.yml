name: Fetch Android WebView 106

on:
  push:
    branches:
      - tmp-fetch-webview-106
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout helper
        uses: actions/checkout@v4

      - name: Fetch WebView APK
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import html
          import os
          import re
          import sys
          import time
          from urllib.parse import urljoin, urlparse
          from urllib.request import Request, build_opener, HTTPRedirectHandler

          EXPECTED = '13182d1a09508114d175c9db2bf0be2719da7a204be28140e7f8bd837d6eb788'
          OUT = 'Android-System-WebView-106.0.5249.126-Android6-ARM.apk'
          UA = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36'
          opener = build_opener(HTTPRedirectHandler())

          def get(url):
              print('GET', url, flush=True)
              req = Request(url, headers={'User-Agent': UA, 'Accept': '*/*', 'Referer': url})
              with opener.open(req, timeout=60) as r:
                  data = r.read()
                  return r.geturl(), dict(r.headers), data

          def links(base, data):
              text = data.decode('utf-8', 'ignore')
              found = []
              for raw in re.findall(r'''(?:href|src)=["']([^"']+)["']''', text, flags=re.I):
                  raw = html.unescape(raw)
                  found.append(urljoin(base, raw))
              for raw in re.findall(r'''https?://[^\s"'<>]+''', text):
                  found.append(html.unescape(raw))
              return list(dict.fromkeys(found))

          seeds = [
              'https://mobile.softpedia.com/apk/android-system-webview/106.0.5249.126/',
              'https://www.apkmirror.com/apk/google-inc/android-system-webview/android-system-webview-106-0-5249-126-release/android-system-webview-106-0-5249-126-2-android-apk-download/',
          ]
          queue = [(u, 0) for u in seeds]
          seen = set()
          pages = 0
          while queue and pages < 40:
              url, depth = queue.pop(0)
              if url in seen or depth > 4:
                  continue
              seen.add(url)
              try:
                  final, headers, data = get(url)
              except Exception as e:
                  print('ERROR', repr(e), flush=True)
                  continue
              pages += 1
              ctype = headers.get('Content-Type', headers.get('content-type', ''))
              print(' ->', final, ctype, len(data), flush=True)
              if data[:4] == b'PK\x03\x04' or 'application/vnd.android.package-archive' in ctype:
                  digest = hashlib.sha256(data).hexdigest()
                  print('APK SHA256', digest, flush=True)
                  if digest == EXPECTED:
                      open(OUT, 'wb').write(data)
                      print('MATCHED', OUT, flush=True)
                      sys.exit(0)
                  print('APK hash mismatch; ignoring', flush=True)
                  continue
              if len(data) > 2_000_000:
                  continue
              open(f'debug-page-{pages}.html', 'wb').write(data)
              candidates = links(final, data)
              scored = []
              for link in candidates:
                  low = link.lower()
                  score = 0
                  if '.apk' in low: score += 100
                  if 'download' in low: score += 30
                  if 'softpedia' in low or 'apkmirror' in low: score += 10
                  if 'android-system-webview' in low or 'webview' in low: score += 20
                  if '106.0.5249.126' in low or '524912603' in low: score += 40
                  if score:
                      scored.append((score, link))
              for score, link in sorted(scored, reverse=True):
                  print(' candidate', score, link, flush=True)
                  if link not in seen:
                      queue.insert(0, (link, depth + 1))
              if 'apkmirror.com' in final and depth == 0:
                  time.sleep(16)

          print('Unable to obtain expected APK', file=sys.stderr)
          sys.exit(1)
          PY

      - name: Verify metadata and signature
        shell: bash
        run: |
          set -euxo pipefail
          FILE='Android-System-WebView-106.0.5249.126-Android6-ARM.apk'
          echo '13182d1a09508114d175c9db2bf0be2719da7a204be28140e7f8bd837d6eb788  '"$FILE" | sha256sum -c -
          jarsigner -verify -certs -verbose "$FILE" > jarsigner.txt
          unzip -t "$FILE" > zip-test.txt
          sha256sum "$FILE" > SHA256.txt
          ls -lh "$FILE"

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-System-WebView-106-verified
          path: |
            Android-System-WebView-106.0.5249.126-Android6-ARM.apk
            SHA256.txt
            jarsigner.txt
            zip-test.txt
          if-no-files-found: error
          retention-days: 2

      - name: Upload debug pages on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: webview-fetch-debug
          path: debug-page-*.html
          if-no-files-found: ignore
          retention-days: 1
